(function () {
  var body = document.getElementById('body'), links = document.getElementById('links');
  body.querySelectorAll('a > .svc').forEach(function (s) {

  body.querySelectorAll('p').forEach(function (p) { if (!p.textContent.trim() && !p.children.length) p.remove(); });
  
  var facts = document.getElementById('facts');
  for (var n = body.firstElementChild; n && n.tagName !== 'H2';) {
    var nx = n.nextElementSibling, st = n.firstElementChild;
    if (n.tagName === 'P' && st && st.tagName === 'STRONG' && /:\s*$/.test(st.textContent)) {
      var k = st.textContent.replace(/:\s*$/, ''), v = n.textContent.slice(st.textContent.length).trim();
      if (v && !/^unknown$/i.test(v)) { var dt = document.createElement('dt'), dd = document.createElement('dd'); dt.textContent = k; dd.textContent = v; facts.append(dt, dd); }
      n.remove();
    }
    n = nx;
  }
  if (!facts.children.length) facts.remove();
  
  body.querySelectorAll('h2').forEach(function (h) {
    if (!/tracklist/i.test(h.textContent)) return;
    var ol = document.createElement('ol'); ol.className = 'tracks';
    var p = h.nextElementSibling;
    while (p && p.tagName === 'P' && p.firstElementChild && p.firstElementChild.tagName === 'STRONG') {
      var nx = p.nextElementSibling, li = document.createElement('li');
      var num = p.firstElementChild.textContent.replace(/\.$/, ''), em = p.querySelector('em');
      var title = '', node = p.firstElementChild.nextSibling;
      while (node && node !== em && !(node.nodeType === 3 && node.textContent.indexOf('|') >= 0)) { title += node.textContent; node = node.nextSibling; }
      if (node && node.nodeType === 3 && !em) title += node.textContent.split('|')[0];
      li.innerHTML = '<span class="n"></span><span class="t"></span><span class="l"></span><span class="d"></span>';
      li.children[0].textContent = num; li.children[1].textContent = title.trim();
      li.children[3].textContent = em ? em.textContent.replace(/[\[\]]/g, '') : '';
      p.querySelectorAll('a').forEach(function (a) { a.textContent = a.textContent.replace(/[^\w.\s]/g, '').trim().toLowerCase(); li.children[2].appendChild(a); });
      if (/Letras/.test(p.textContent)) { var s = document.createElement('span'); s.textContent = 'letra'; s.className = 'lyr'; li.children[2].appendChild(s); }
      ol.appendChild(li); p.remove(); p = nx;
    }
    if (ol.children.length) h.after(ol);
  });
  body.querySelectorAll('table').forEach(function (t) {
    var w = document.createElement('div'); w.className = 'tablewrap'; t.parentNode.insertBefore(w, t); w.appendChild(t);

    h.replaceWith(d);
  });
})();
