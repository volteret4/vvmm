{{/* Lupa de la cabecera: busca en discos, colección y géneros (índice /index.json) */}}
<button type="button" class="lupa" id="lupa" aria-label="Buscar" title="Buscar (/)">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
</button>
<dialog class="buscador" id="buscador" aria-label="Buscar">
  <form method="dialog" class="bq">
    <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2.2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
    <input type="search" id="bq" placeholder="artista, disco o género…" autocomplete="off" spellcheck="false">
    <button value="x" aria-label="Cerrar">esc</button>
  </form>
  <div class="bres" id="bres"></div>
</dialog>
<script>
(function () {
  var dlg = document.getElementById('buscador'), q = document.getElementById('bq'), res = document.getElementById('bres');
  var idx = null, sel = 0, items = [];
  var NOMBRE = { g: 'géneros', d: 'discos', c: 'colección' };
  function norm(s) { return (s || '').toString().normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase(); }
  function esc(s) { return (s || '').toString().replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function load() {
    if (idx) return Promise.resolve(idx);
    return fetch('{{ "index.json" | relURL }}').then(function (r) { return r.json(); }).then(function (d) {
      idx = d.map(function (x) { x.k = norm([x.a, x.b, (x.g || []).join(' ')].join(' ')); x.kn = norm(x.b); x.ka = norm(x.a); return x; });
      return idx;
    });
  }
  // géneros a mostrar: primero los que coinciden con la búsqueda
  function gen(g, words) {
    var hit = g.filter(function (x) { return words.some(function (w) { return norm(x).indexOf(w) >= 0; }); });
    return hit.concat(g.filter(function (x) { return hit.indexOf(x) < 0; })).slice(0, 3);
  }
  function open() { dlg.showModal(); q.select(); load().then(render); }
  function render() {
    var words = norm(q.value).split(/\s+/).filter(Boolean);
    if (!idx) return;
    if (!words.length) { res.innerHTML = '<p class="bvacio">Escribe para buscar en discos, colección y géneros.</p>'; items = []; return; }
    var grupos = { g: [], d: [], c: [] };
    idx.forEach(function (x) {
      if (!words.every(function (w) { return x.k.indexOf(w) >= 0; })) return;
      var full = words.join(' ');
      x.p = (x.kn === full ? 0 : x.kn.indexOf(full) === 0 || x.ka.indexOf(full) === 0 ? 1 : 2) - (x.n ? Math.min(x.n, 50) / 100 : 0);
      grupos[x.s].push(x);
    });
    var html = '';
    ['g', 'd', 'c'].forEach(function (s) {
      var l = grupos[s].sort(function (a, b) { return a.p - b.p; });
      if (!l.length) return;
      var max = s === 'g' ? 12 : 30;
      html += '<h3>' + NOMBRE[s] + ' <small>' + l.length + '</small></h3>';
      if (s === 'g') {
        html += '<div class="bgen">' + l.slice(0, max).map(function (x) { return '<a href="' + x.u + '">' + esc(x.b) + '<sup>' + x.n + '</sup></a>'; }).join('') + '</div>';
      } else {
        html += '<ul>' + l.slice(0, max).map(function (x) {
          return '<li><a href="' + x.u + '">' + (x.i ? '<img src="' + x.i + '" alt="" loading="lazy">' : '<span class="bnoc"></span>') +
            '<span><b>' + esc(x.b) + '</b><i>' + esc(x.a) + (x.g && x.g.length ? ' · ' + esc(gen(x.g, words).join(', ')) : '') + '</i></span></a></li>';
        }).join('') + '</ul>';
        if (l.length > max) html += '<p class="bmas">y ' + (l.length - max) + ' más…</p>';
      }
    });
    res.innerHTML = html || '<p class="bvacio">Nada para «' + esc(q.value) + '».</p>';
    items = Array.prototype.slice.call(res.querySelectorAll('a'));
    sel = 0; mark();
  }
  function mark() { items.forEach(function (a, i) { a.classList.toggle('sel', i === sel); }); if (items[sel]) items[sel].scrollIntoView({ block: 'nearest' }); }
  document.getElementById('lupa').addEventListener('click', open);
  q.addEventListener('input', render);
  q.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (items.length) { sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; mark(); } }
    else if (e.key === 'Enter') { e.preventDefault(); if (items[sel]) location.href = items[sel].href; }
  });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && !dlg.open && !/input|textarea|select/i.test(document.activeElement.tagName)) { e.preventDefault(); open(); }
  });
})();
</script>
